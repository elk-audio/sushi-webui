<title>Sushi WebUI Sketch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: a "bench" (device switcher + caption) holding a framed app; the app is a stage console:
   graphite surfaces with a cool bias, one amber accent for interaction, meter semantics kept separate.
   Single dark world on purpose (stage, low glare), so no light theme blocks. */
:root{
  color-scheme: dark;
  --bg:#101318;          /* bench */
  --app:#15191f;         /* app ground */
  --s1:#1c2129;          /* surface */
  --s2:#252b35;          /* raised */
  --s3:#2f3642;          /* control track */
  --line:#343c49;
  --text:#e7e9ee;
  --muted:#8c95a5;
  --faint:#5d6676;
  --accent:#f0a83c;      /* interaction / focus / value arcs */
  --accent-ink:#1b1306;
  --solo:#4fa8e0;
  --m-green:#45c486; --m-amber:#e8bf45; --m-red:#ec4d4f;
  --font-ui:"IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---------- bench ---------- */
.bench-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.bench-title{font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;gap:8px;align-items:baseline}
.bench-title small{font-weight:400;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:6px;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--text)}
.bench-bar label{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.bench-bar select{min-height:32px;padding:4px 8px;font-size:13px}
.ghost-btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
.ghost-btn:hover{color:var(--text)}
.caption{color:var(--muted);font-size:13px;margin:0 0 10px;min-height:1.3em}
.caption b{color:var(--text);font-weight:600}
.stage{position:relative}
.frame{position:relative;transform-origin:top left;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.frame.auto{width:100%;height:calc(100dvh - 110px);min-height:520px;border-radius:10px;transform:none!important}
.frame-label{position:absolute;top:-2px;right:0;color:var(--faint);font-size:12px}

/* ---------- app ---------- */
#app{position:relative;width:100%;height:100%;background:var(--app);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
#app.offline .content, #app.offline .dock{opacity:.45;pointer-events:none}
.topbar{display:flex;align-items:center;gap:12px;padding:0 12px;height:48px;border-bottom:1px solid var(--line);background:var(--s1);flex:none}
.proj{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.proj .dirty{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.proj .clipdot{width:8px;height:8px;border-radius:50%;background:var(--m-red);box-shadow:0 0 8px var(--m-red)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs button{color:var(--muted);padding:6px 2px}
.crumbs button:hover{color:var(--text)}
.crumbs .here{color:var(--text);font-weight:600}
.crumbs .sep{color:var(--faint)}
.spacer{flex:1}
.transport{display:flex;align-items:center;gap:8px}
.tempo{padding:6px 8px;border-radius:6px;background:var(--s2);cursor:ns-resize;touch-action:none}
.tempo small{color:var(--muted);font-family:var(--font-ui);margin-left:4px}
.tbtn{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;background:var(--s2)}
.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.cpu{color:var(--muted);font-size:13px;white-space:nowrap}
.conn{width:10px;height:10px;border-radius:50%;background:var(--m-green);flex:none}
.conn.lost{background:var(--m-amber);animation:blink 1s infinite}
.backbtn{display:flex;align-items:center;gap:2px;color:var(--accent);padding:8px 4px;font-weight:600;white-space:nowrap}
.ptitle{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.banner{background:var(--m-amber);color:#1e1704;font-weight:600;padding:6px 12px;font-size:13px;flex:none}
.content{flex:1;min-height:0;overflow:auto;position:relative}
.dock{flex:none;border-top:1px solid var(--line);background:var(--s1)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--s1);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{padding:10px 0 12px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.04em}
.tabbar button[aria-current="true"]{color:var(--accent)}
.tabbar svg{width:20px;height:20px}

/* shared controls */
.tog{min-width:34px;height:30px;border-radius:5px;background:var(--s3);color:var(--muted);font-weight:700;font-size:13px}
.tog.m.on{background:var(--m-amber);color:#211a03}
.tog.s.on{background:var(--solo);color:#04131d}
.kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind b{color:var(--text);font-weight:600}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;cursor:ns-resize;outline:none}
.knob svg{display:block;overflow:visible}
.knob .trk{stroke:var(--s3)}
.knob .val{stroke:var(--accent)}
.knob .cap{fill:var(--s2);stroke:var(--line)}
.knob .ind{stroke:var(--text);stroke-width:6;stroke-linecap:round}
.knob .lab{font-size:12px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.knob .v{font-family:var(--font-num);font-size:11px;color:var(--text);white-space:nowrap}
.knob.pinned .lab{color:var(--accent)}
.knob.pickable{cursor:pointer}
.knob.pickable svg{opacity:.55}
.knob.pickable.pinned svg{opacity:1}
.knob:focus-visible .cap{stroke:var(--accent)}
.dragging .val{stroke:#ffc76d}

/* ---------- mixer: strips ---------- */
.mixer{display:flex;height:100%;min-height:0}
.strips{flex:1;display:flex;gap:6px;padding:10px;overflow-x:auto;overflow-y:hidden;min-width:0}
.strip{flex:none;width:92px;background:var(--s1);border-radius:var(--r);display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0 6px 8px;position:relative;border-top:4px solid var(--tc)}
.is-tablet .strip{width:80px}
.is-short .chips,.is-short .strip .kind{display:none}
.is-short .strip{gap:4px}
.strip-name{font-weight:700;padding:8px 0 0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip-name:hover{color:var(--accent)}
.chips{display:flex;flex-direction:column;gap:3px;min-height:72px}
.chip{font-size:12px;text-align:left;padding:3px 6px;border-radius:4px;background:var(--s2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.chip.byp{color:var(--faint);text-decoration:line-through}
.chip.more{background:none;color:var(--muted);padding-left:6px}
.chip:hover{outline:1px solid var(--line)}
.strip .knob{align-self:center}
.fz{flex:1;min-height:120px;display:flex;justify-content:center;gap:6px;position:relative}
.vfader{position:relative;width:26px;touch-action:none;cursor:ns-resize}
.vfader::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:4px;margin-left:-2px;background:var(--s3);border-radius:2px}
.vfader .thumb{position:absolute;left:0;width:26px;height:20px;bottom:calc(var(--v) * (100% - 20px));background:linear-gradient(#5b6575,#3c4452);border:1px solid #6a7486;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.vfader .thumb::after{content:"";position:absolute;left:3px;right:3px;top:9px;height:2px;background:var(--text)}
.vfader.dragging .thumb{border-color:var(--accent)}
.scale{position:relative;width:18px;font-family:var(--font-num);font-size:9px;color:var(--faint)}
.scale span{position:absolute;right:0;transform:translateY(50%);bottom:calc(10px + var(--p) * (100% - 20px))}
canvas.meter{display:block}
.fz canvas.meter{width:14px;height:100%}
.db{font-family:var(--font-num);font-size:12px;text-align:center;color:var(--text)}
.ms{display:flex;gap:4px;justify-content:center}
.ms .tog{flex:1}
.strip.post{border-top-color:var(--text);background:var(--s2);margin:10px 10px 10px 0;width:92px}
.add-strip{flex:none;width:92px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600}
.add-strip:hover{color:var(--accent);border-color:var(--accent)}
.add-strip span{font-size:28px;line-height:1}
.pending{position:absolute;inset:0;background:rgba(21,25,31,.75);display:grid;place-items:center;border-radius:var(--r);font-size:12px;color:var(--muted);z-index:2}
.spin{width:18px;height:18px;border:2px solid var(--s3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.3}}

/* ---------- mixer: phone rows ---------- */
.rows{display:flex;flex-direction:column;gap:2px;padding:8px 0}
.row{display:grid;grid-template-columns:4px 1fr;gap:10px;padding:8px 12px 10px 0;background:var(--s1);position:relative;cursor:pointer}
.row .stripe{background:var(--tc);border-radius:0 2px 2px 0}
.row>div{min-width:0}
.row-top{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:6px}
.row-top .kind{min-width:0}
.row-top .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-top .tog{height:34px;min-width:40px}
.row-bot{display:flex;align-items:center;gap:10px}
.hfader{position:relative;flex:1;height:40px;border-radius:6px;background:var(--s2);touch-action:pan-y;cursor:ew-resize;overflow:hidden}
.hfader canvas.meter{position:absolute;left:8px;right:8px;top:50%;height:14px;margin-top:-7px;width:calc(100% - 16px)}
.hfader .zero{position:absolute;top:6px;bottom:6px;width:1px;background:var(--faint);left:calc(8px + var(--z) * (100% - 16px))}
.hfader .hthumb{position:absolute;top:4px;bottom:4px;width:14px;margin-left:-7px;left:calc(8px + var(--v) * (100% - 16px));border-radius:4px;background:linear-gradient(90deg,#5b6575,#3c4452);border:1px solid #6a7486;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.hfader .hthumb::after{content:"";position:absolute;top:6px;bottom:6px;left:5px;width:2px;background:var(--text)}
.hfader.dragging .hthumb{border-color:var(--accent)}
.row-bot .db{width:62px;text-align:right;flex:none}
.add-row{margin:10px 12px;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);font-weight:600;text-align:center}
.mdock{display:flex;align-items:center;gap:10px;padding:8px 12px}
.mdock .lbl{font-weight:700;font-size:12px;letter-spacing:.08em;width:56px}
.mdock .db{width:62px;text-align:right}
.landscape-note{font-size:12px;color:var(--muted)}

/* ---------- empty state ---------- */
.empty{max-width:520px;margin:48px auto;padding:0 16px;text-align:center;display:flex;flex-direction:column;gap:16px}
.empty h2{margin:0;font-size:24px;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
.kindcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kindcard{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.kindcard b{font-size:16px}
.kindcard span{color:var(--muted);font-size:13px}
.kindcard:hover,.kindcard[aria-pressed="true"]{border-color:var(--accent)}
.kindcard svg{width:28px;height:28px;color:var(--accent)}

/* ---------- track view ---------- */
.trackview{display:flex;flex-direction:column;height:100%;min-height:0}
.tbody{flex:1;display:flex;min-height:0}
.chainwrap{flex:1;overflow:auto;padding:16px;min-width:0}
.chain{display:flex;align-items:stretch;gap:0;min-width:min-content}
.io{flex:none;width:96px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:12px;color:var(--muted);font-size:12px}
.io b{color:var(--text);font-size:13px;letter-spacing:.08em}
.io .arrow{color:var(--faint);font-size:18px}
.section{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;border-left:1px dashed var(--line)}
.section h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px}
.section .cards{display:flex;gap:10px;align-items:flex-start}
.card{width:208px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;position:relative;flex:none}
.card.byp .macros,.card.byp .card-prog{opacity:.35}
.card.byp .card-name{color:var(--muted)}
.card-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 8px;border-bottom:1px solid var(--line)}
.pwr{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--accent);background:var(--s2);flex:none}
.card.byp .pwr{color:var(--faint)}
.card-name{flex:1;text-align:left;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0}
.card-name small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.card-name:hover{color:var(--accent)}
.handle{width:28px;height:30px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;flex:none}
.card-prog{display:flex;align-items:center;gap:4px;padding:6px 8px 0}
.card-prog button{height:28px}
.card-prog .arr{width:28px;border-radius:5px;background:var(--s2);color:var(--muted)}
.card-prog .pname{flex:1;text-align:left;font-size:13px;padding:0 6px;border-radius:5px;background:var(--s2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;padding:10px 6px}
.macros .none{grid-column:1/-1;color:var(--faint);font-size:12px;text-align:center;padding:8px 0}
.card.ghost{border-style:dashed;min-height:120px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.card.drag{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.6);border-color:var(--accent);transition:none}
.addslot{flex:none;width:44px;align-self:stretch;min-height:120px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:22px}
.addslot:hover{color:var(--accent);border-color:var(--accent)}
.inspector{flex:none;width:200px;border-left:1px solid var(--line);background:var(--s1);padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.inspector h4{margin:0;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600}
.insp-name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.insp-name i{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:22px;height:22px;border-radius:5px;background:var(--c)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:2px}
.insp-mix{display:flex;gap:10px;align-items:stretch;height:200px}
.insp-mix .fz{min-height:0}
.insp-side{display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.route{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.route span{color:var(--muted)}
.danger{color:var(--m-red);border:1px solid #5a2a2d;border-radius:6px;padding:8px;font-weight:600}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.confirm .yes{background:var(--m-red);color:#fff;border-radius:6px;padding:6px 10px;font-weight:700}
.confirm .no{border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.tdock{display:flex;align-items:center;gap:10px;padding:8px 12px}
.tdock .db{width:62px;text-align:right}
.tdock .tog{height:36px;min-width:40px}

/* phone track view */
.is-phone .chainwrap{padding:10px 10px 16px}
.is-phone .chain{flex-direction:column;min-width:0}
.is-phone .section{border-left:0;border-top:1px dashed var(--line);padding:10px 0 4px}
.is-phone .section .cards{flex-direction:column;align-items:stretch}
.is-phone .card{width:auto}
.is-phone .io{width:auto;flex-direction:row;align-items:center;padding:4px 2px 10px}
.is-phone .io .arrow{transform:rotate(90deg)}
.is-phone .addslot{width:auto;min-height:44px;font-size:14px;font-weight:600}
.is-phone .macros{grid-template-columns:repeat(4,1fr)}
.card.collapsed .macros,.card.collapsed .card-prog{display:none}
.card.collapsed .card-head{border-bottom:0}

/* ---------- plugin view ---------- */
.pluginview{display:flex;height:100%;min-height:0}
.progs{flex:none;width:190px;border-right:1px solid var(--line);background:var(--s1);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.progs h4{margin:0 4px 6px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600}
.progs button{text-align:left;padding:8px 10px;border-radius:6px;color:var(--muted)}
.progs button[aria-current="true"]{background:var(--s2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.progs .pinbtn{margin-top:auto;border:1px solid var(--line);color:var(--text);text-align:center}
.progs .pinbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pmain{flex:1;overflow:auto;min-width:0}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--app);z-index:3}
.phead .pn{font-size:20px;font-weight:700}
.phead .pn small{font-size:12px;color:var(--faint);font-weight:400;margin-left:6px}
.progstep{display:flex;align-items:center;gap:4px}
.progstep .arr{width:36px;height:36px;border-radius:6px;background:var(--s2);color:var(--muted)}
.progstep .pname{height:36px;padding:0 12px;border-radius:6px;background:var(--s2);min-width:120px;text-align:left;font-weight:600}
.phead input{min-height:36px;width:180px}
.phead canvas.meter{width:12px;height:36px}
.pinhint{width:100%;font-size:13px;color:var(--accent)}
.groups{padding:6px 16px 24px;display:flex;flex-direction:column;gap:18px}
.group h5{margin:10px 0 10px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:10px}
.group h5::after{content:"";flex:1;height:1px;background:var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 8px}
.is-phone .pgrid{grid-template-columns:1fr 1fr;gap:18px 8px}
.pctl{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center}
.pctl .lab{font-size:12px;color:var(--muted)}
.bigtog{min-width:64px;height:40px;border-radius:6px;background:var(--s3);color:var(--muted);font-weight:700}
.bigtog.on{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:40px;border-radius:6px;background:var(--s2);font-size:18px;color:var(--muted)}
.stepper .sv{min-width:60px;text-align:center;font-family:var(--font-num);font-size:13px}

  S.route = {view:'mixer', t:0, p:0}; S.sheet = null; S.confirm = null;
  meters.clear();
}

// ---------------------------------------------------------------- controls registry
const trk = i => i === 'm' ? S.master : i === 'pre' ? S.pre : S.tracks[+i];
const tkey = v => (v === 'm' || v === 'pre') ? v : +v;
const navOrder = () => { const o = S.tracks.map((_, i) => i); return S.advanced ? ['pre', ...o, 'm'] : o; };
const busOf = sd => S.tracks.find(b => b.id === sd.bus);
const sendersOf = b => S.tracks.filter(t => t.sends.some(sd => sd.bus === b.id));
const hasPan = t => t.kind !== 'pre' && t.kind !== 'post';
function ctl(key){
  const [k, a, b, c] = key.split(':');
  if (k === 't') {
    const tr = trk(a);
    if (b === 'gain') return {get: () => posFromDb(tr.gain), set: v => { tr.gain = Math.abs(dbFromPos(v)) < 0.25 ? 0 : dbFromPos(v); }, def: posFromDb(0), fmt: () => fmtDb(tr.gain), label:'Gain'};
    if (b === 'pan') return {get: () => (tr.pan + 1) / 2, set: v => { let p = v * 2 - 1; tr.pan = Math.abs(p) < 0.02 ? 0 : p; }, def: 0.5, fmt: () => fmtPan(tr.pan), bipolar: true, label:'Pan'};
  }
  if (k === 'p') {
    const it = trk(a).chain[+b]; const p = it.tpl.params.find(x => x.id === c);
    return {get: () => it.v[c], set: v => { it.v[c] = quantize(p, v); }, def: p.defN, fmt: () => fmtParam(p, it.v[c]), label: p.label, bipolar: p.min < 0 && p.max > 0 && p.unit !== 'dB' || (p.unit === 'dB' && p.min < 0 && p.max > 0 && p.max === -p.min)};
  }
  if (k === 's') { const sd = trk(a).sends[+b]; return {get: () => posFromDb(sd.level), set: v => { sd.level = dbFromPos(v); }, def: posFromDb(-12), fmt: () => fmtDb(sd.level), label: 'Send ' + busOf(sd).name}; }
  if (k === 'x') return {get: () => (S.tempo - 20) / 280, set: v => { S.tempo = Math.round((20 + v * 280) * 10) / 10; }, def: 100 / 280, fmt: () => S.tempo.toFixed(1)};
}
function refresh(key){
  const c = ctl(key); const v = c.get();
  document.querySelectorAll(`[data-ctl="${key}"]`).forEach(el => paint(el, v, c));
  document.querySelectorAll(`[data-val="${key}"]`).forEach(el => { el.textContent = c.fmt(); });
}
const C = 2 * Math.PI * 40, SWEEP = 0.75 * C;
function paint(el, v, c){
  el.style.setProperty('--v', v);
  el.setAttribute('aria-valuenow', c.fmt());
  if (el.classList.contains('knob')) {
    const val = el.querySelector('.val'), ind = el.querySelector('.ind');
    let start = 135, len = v * SWEEP;
    if (c.bipolar) { if (v >= 0.5) { start = 270; len = (v - 0.5) * SWEEP; } else { start = 135 + 270 * v; len = (0.5 - v) * SWEEP; } }
    val.setAttribute('stroke-dasharray', `${Math.max(len, 0.001)} ${C}`);
    val.setAttribute('transform', `rotate(${start} 50 50)`);
    ind.setAttribute('transform', `rotate(${135 + 270 * v - 270} 50 50)`);
  }
}

};
function knob(key, size = 44, label = null, extra = ''){
  const c = ctl(key);
  return `<div class="knob ${extra}" data-ctl="${key}" data-type="knob" role="slider" tabindex="0" aria-label="${esc(label || c.label)}" style="width:${extra.includes('mini') ? 38 : size <= 32 ? 44 : Math.max(size, 56)}px">
    <svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">

function vfader(ti){

    <div class="vfader" data-ctl="${key}" data-type="vfader" role="slider" tabindex="0" aria-label="Gain"><div class="thumb"></div></div>

}

}
const ms = (ti, master) => `<div class="ms"><button class="tog m ${trk(ti).mute ? 'on' : ''}" data-act="mute:${ti}" aria-pressed="${trk(ti).mute}">M</button>${master ? '' : `<button class="tog s ${trk(ti).solo ? 'on' : ''}" data-act="solo:${ti}" aria-pressed="${trk(ti).solo}">S</button>`}</div>`;
const msInline = (ti, noSolo) => ms(ti, noSolo).replace('<div class="ms">', '').replace(/<\/div>$/, '');
const kindLabel = t => ({
  midi: `<b>MIDI</b> · ${esc(t.input.replace('MIDI ', ''))}`,

// ---------------------------------------------------------------- views
function topbar(){

  const trans = `<div class="transport">
      ${phone ? '' : `<div class="tempo num" data-ctl="x:tempo" data-type="num" role="slider" tabindex="0" aria-label="Tempo"><span data-val="x:tempo">${S.tempo.toFixed(1)}</span><small>BPM</small></div>`}
      <button class="tbtn ${S.playing ? 'on' : ''}" data-act="play" aria-label="Play">${ICON.play}</button>
      ${phone ? '' : `<button class="tbtn" data-act="stop" aria-label="Stop">${ICON.stop}</button>`}
    </div>
    <span class="cpu num" id="cpu">${Math.round(S.cpu * 100)}%${phone ? '' : ' CPU'}</span>
    <span class="conn ${S.conn !== 'ok' ? 'lost' : ''}" title="${S.conn === 'ok' ? 'Connected to Sushi' : 'Reconnecting'}"></span>`;
  if (phone) {
    let left;
    if (r.view === 'mixer') left = `<button class="proj ptitle" data-sheet="project">${esc(S.project)}${S.dirty ? '<span class="dirty"></span>' : ''}${masterClip ? '<span class="clipdot"></span>' : ''}</button>`;

  }

function chips(t, ti){

function sendsMini(t, ti){

}
function mixerView(){
  const all = S.tracks.map((t, ti) => [t, ti]);
  const regs = all.filter(([t]) => t.kind !== 'bus'), buses = all.filter(([t]) => t.kind === 'bus');

function card(t, ti, p, pi){
  const progs = p.tpl.programs;
  const prog = progs ? `<div class="card-prog"><button class="arr" data-act="prog:${ti}:${pi}:-1" aria-label="Previous program">‹</button>

  const sub = p.tpl.type === 'internal' ? '' : `<small>${p.tpl.type.toUpperCase()}</small>`;
  return `<div class="card ${p.bypass ? 'byp' : ''} ${S.size === 'phone' && p.collapsed ? 'collapsed' : ''}" data-card="${pi}">

function sectionsFor(t){

  pre: ['ENGINE IN', t.input], post: ['ALL TRACKS', 'summed']}[t.kind]);
const routeOut = t => t.kind === 'post' ? 'Out 1-8' : t.kind === 'pre' ? 'all tracks' : t.output;
function trackHeader(ti, t){

function sendCard(ti, sd, si){
  const b = busOf(sd);
  return `<div class="card send" style="--tc:${b.color}">
    <div class="card-head"><button class="card-name" data-go="track:${S.tracks.indexOf(b)}">→ ${esc(b.name)}<small>BUS · ${esc(b.chain.map(p => p.name).join(', ') || 'no effects')}</small></button>

      <div class="opts prepost"><button data-act="sendmode:${ti}:${si}:pre" aria-pressed="${!sd.post}">Pre</button><button data-act="sendmode:${ti}:${si}:post" aria-pressed="${sd.post}">Post</button></div></div></div>`;

function trackView(){
  const ti = S.route.t, t = trk(ti), phone = S.size === 'phone';
  const secs = sectionsFor(t).map(sec => {
    const items = t.chain.map((p, pi) => [p, pi]).filter(([p]) => p.tpl.role === sec);
    const cards = items.map(([p, pi]) => card(t, ti, p, pi)).join('');
    const ghost = S.pendingPlugin && S.pendingPlugin.t === ti && S.pendingPlugin.sec === sec ? `<div class="card ghost"><div><div class="spin"></div>Loading ${esc(TPL[S.pendingPlugin.k].name)}…</div></div>` : '';
    const full = sec === 'instrument' && items.length >= 1;
    const add = full ? '' : `<button class="addslot" data-sheet="browse:${ti}:${sec}" aria-label="Add ${ROLE_LABEL[sec]}">${phone ? '＋ Add ' + (sec === 'instrument' ? 'instrument' : sec === 'midi_fx' ? 'MIDI effect' : 'effect') : '＋'}</button>`;

function inspector(t, ti){
  const fixed = t.kind === 'pre' || t.kind === 'post';
  const hidden = ['level meter'].concat(t.sends.length ? [`${t.sends.length} send${t.sends.length > 1 ? 's' : ''}`] : [], t.kind === 'bus' ? ['return'] : []).join(', ');
  return `<aside class="inspector" style="--tc:${t.color}">

    ${fixed ? '' : `<h4>Color</h4><div class="swatches">${PALETTE.map(c => `<button style="--c:${c}" data-act="color:${ti}:${c}" aria-pressed="${c === t.color}" aria-label="Color"></button>`).join('')}</div>`}

// ---------------------------------------------------------------- meters (simulated engine + one rAF loop)
const meters = new Map(); // key -> state
let meterEls = [];
function mstate(k){ let m = meters.get(k); if (!m) { m = {t:[-120, -120], d:[-120, -120], pk:[-120, -120], pkT:[0, 0], clip:false}; meters.set(k, m); } return m; }
function registerMeters(){
  const dpr = window.devicePixelRatio || 1;
  meterEls = [...app.querySelectorAll('canvas.meter')].map(cv => {
    const r = cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width * dpr / (frameScale || 1))), h = Math.max(1, Math.round(r.height * dpr / (frameScale || 1)));
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    const vert = cv.dataset.orient === 'v';
    const g = vert ? ctx.createLinearGradient(0, h, 0, 0) : ctx.createLinearGradient(0, 0, w, 0);
    const y = db => (db + 60) / 66;
    g.addColorStop(0, '#2f9e6a'); g.addColorStop(y(-12), '#45c486'); g.addColorStop(y(-12) + 0.001, '#e8bf45'); g.addColorStop(y(-3), '#e8bf45'); g.addColorStop(y(-3) + 0.001, '#ec4d4f'); g.addColorStop(1, '#ec4d4f');
    return {cv, ctx, w, h, vert, g, key: cv.dataset.meter};
  });
}
const frac = db => clamp((db + 60) / 66);
function chGains(tr){                       // mirrors Track::_apply_pan_and_gain (approximate pan law)
  const lin = Math.pow(10, tr.gain / 20);
  return [lin * (tr.pan > 0 ? 1 - tr.pan : 1), lin * (tr.pan < 0 ? 1 + tr.pan : 1)];
}
let tSim = 0;
function simulate(){                          // what sushi-webui would send: ≤25 Hz per meter
  tSim += 0.04;
  const anySolo = S.tracks.some(t => t.solo);
  const beatLen = 60 / S.tempo;
  const sumPow = [0, 0], busIn = new Map();
  const lg = x => 20 * Math.log10(Math.max(x, 1e-6));
  const post = (t, preDb, key) => {          // pre-fader peakmeter + backend fader/pan compensation
    const m = mstate(key), [gl, gr] = chGains(t);
    const silent = t.mute || (anySolo && !t.solo && t.kind !== 'bus');   // buses are solo-safe
    m.t = silent || preDb <= -119 ? [-120, -120] : [preDb + lg(gl) + (Math.random() - 0.5), preDb + lg(gr) + (Math.random() - 0.5)];
    m.t.forEach((db, c) => { if (db > -119) sumPow[c] += Math.pow(10, db / 10); if (db > 0) m.clip = true; });
    return silent;
  };
  mstate('pre').t = [-16 + (Math.random() - 0.5) * 6, -17 + (Math.random() - 0.5) * 6];
  S.tracks.forEach((t, i) => {
    if (t.kind === 'bus') return;
    const active = t.kind === 'audio' || S.playing, g = t.gen;
    let pre = -120;
    if (active && !t.pending) {
      const phase = (tSim % beatLen) / beatLen;
      const beat = g.beat ? g.beat * 22 * Math.exp(-phase * 7) : 0;
      pre = g.base + Math.sin(tSim * 0.7 + i) * g.vary * 0.6 + (Math.random() - 0.5) * g.vary + beat;
      if (t.chain.length && t.chain.every(p => p.bypass)) pre -= 3;
    }
    const silent = post(t, pre, String(i));
    for (const sd of t.sends) {               // hidden send processor; post-fader = level + fader gain
      if (pre <= -119 || (sd.post && silent)) continue;
      busIn.set(sd.bus, (busIn.get(sd.bus) || 0) + Math.pow(10, (pre + sd.level + (sd.post ? t.gain : 0)) / 10));
    }
  });
  S.tracks.forEach((t, i) => { if (t.kind === 'bus') { const p = busIn.get(t.id); post(t, p ? 10 * Math.log10(p) + 3 + (Math.random() - 0.5) * 2 : -120, String(i)); } });
  const mm = mstate('m'); const [ml, mr] = chGains(S.master);
  mm.t = S.master.mute ? [-120, -120] : sumPow.map((p, c) => 10 * Math.log10(Math.max(p, 1e-12)) + 20 * Math.log10([ml, mr][c]));
  if (mm.t.some(d => d > 0) && !mm.clip) { mm.clip = true; if (!S.sheet && !drag && !reorder) render(); }
}
setInterval(simulate, 40);
setInterval(() => { S.cpu = clamp(0.12 + S.tracks.length * 0.012 + Math.random() * 0.04, 0, 0.95); const el = $('#cpu'); if (el) el.textContent = Math.round(S.cpu * 100) + '%' + (S.size === 'phone' ? '' : ' CPU'); }, 1000);

let last = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  for (const m of meters.values()) for (let c = 0; c < 2; c++) {
    if (m.t[c] > m.d[c]) m.d[c] += (m.t[c] - m.d[c]) * 0.7; else m.d[c] = Math.max(m.t[c], m.d[c] - 26 * dt);
    if (m.d[c] >= m.pk[c]) { m.pk[c] = m.d[c]; m.pkT[c] = now; } else if (now - m.pkT[c] > 1500) m.pk[c] = Math.max(m.d[c], m.pk[c] - 20 * dt);
  }
  for (const e of meterEls) {
    const m = mstate(e.key), {ctx, w, h, vert, g} = e;
    ctx.clearRect(0, 0, w, h);
    if (vert) {
      const led = Math.round(h * 0.05) + 2, gap = Math.max(1, Math.round(w * 0.12)), bw = (w - gap) / 2, H = h - led - 2;
      ctx.fillStyle = m.clip ? '#ec4d4f' : '#2f3642'; ctx.fillRect(0, 0, w, led);
      for (let c = 0; c < 2; c++) {
        const x = c * (bw + gap);
        ctx.globalAlpha = 0.14; ctx.fillStyle = g; ctx.fillRect(x, led + 2, bw, H); ctx.globalAlpha = 1;
        const lv = frac(m.d[c]) * H; ctx.fillRect(x, h - lv, bw, lv);
        const pk = frac(m.pk[c]); if (pk > 0.01) { ctx.fillStyle = '#e7e9ee'; ctx.fillRect(x, h - pk * H, bw, Math.max(1, h * 0.006)); ctx.fillStyle = g; }
      }
    } else {
      const led = Math.round(w * 0.025) + 2, gap = Math.max(1, Math.round(h * 0.15)), bh = (h - gap) / 2, W = w - led - 2;
      for (let c = 0; c < 2; c++) {
        const y = c * (bh + gap);
        ctx.globalAlpha = 0.12; ctx.fillStyle = g; ctx.fillRect(0, y, W, bh); ctx.globalAlpha = 1;
        ctx.fillRect(0, y, frac(m.d[c]) * W, bh);
        const pk = frac(m.pk[c]); if (pk > 0.01) { ctx.fillStyle = '#e7e9ee'; ctx.fillRect(pk * W, y, Math.max(1, w * 0.004), bh); ctx.fillStyle = g; }
      }
      ctx.fillStyle = m.clip ? '#ec4d4f' : '#2f3642'; ctx.fillRect(w - led, 0, led, h);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- gestures
let drag = null, lastTap = {key: null, t: 0};
const pointers = new Set();
app.addEventListener('pointerdown', e => {
  pointers.add(e.pointerId);
  if (drag && pointers.size > 1) { drag.fine = true; rebase(); return; }
  const cv = e.target.closest('canvas.meter');
  if (cv && !e.target.closest('[data-ctl]')) { const m = mstate(cv.dataset.meter); m.clip = false; if (cv.dataset.meter === 'm') render(); return; }
  const h = e.target.closest('[data-drag]');
  if (h) return startReorder(e, h);
  const el = e.target.closest('[data-ctl]'); if (!el) return;
  const type = el.dataset.type, c = ctl(el.dataset.ctl);
  drag = {el, key: el.dataset.ctl, type, c, x0: e.clientX, y0: e.clientY, v0: c.get(), captured: type !== 'hfader', moved: false, fine: e.shiftKey || el.dataset.fine === '1', id: e.pointerId};
  if (drag.captured) { el.setPointerCapture(e.pointerId); e.preventDefault(); el.classList.add('dragging'); }
});
function rebase(){ if (!drag) return; drag.v0 = drag.c.get(); drag.x0 = drag.lx ?? drag.x0; drag.y0 = drag.ly ?? drag.y0; }
app.addEventListener('pointermove', e => {
  if (reorder) return moveReorder(e);
  if (!drag || e.pointerId !== drag.id) return;
  const dx = (e.clientX - drag.x0) / frameScale, dy = (e.clientY - drag.y0) / frameScale;
  if (!drag.captured) {
    if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) { drag.captured = true; drag.el.setPointerCapture(e.pointerId); drag.el.classList.add('dragging'); drag.x0 = e.clientX; drag.v0 = drag.c.get(); }
    else if (Math.abs(dy) > 8) { drag = null; }
    return;
  }
  const fine = e.shiftKey || drag.fine;
  if (fine !== drag.wasFine) { drag.wasFine = fine; drag.lx = e.clientX; drag.ly = e.clientY; rebase(); return; }
  drag.lx = e.clientX; drag.ly = e.clientY;
  const r = drag.el.getBoundingClientRect();
  let delta;
  if (drag.type === 'hfader') delta = (e.clientX - drag.x0) / (r.width - 16);
  else if (drag.type === 'vfader') delta = -(e.clientY - drag.y0) / (r.height - 20);
  else delta = -(e.clientY - drag.y0) / (200 * frameScale);
  if (Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) > 3) drag.moved = true;
  drag.c.set(clamp(drag.v0 + delta * (fine ? 0.1 : 1)));
  S.dirty = true;
  refresh(drag.key);
});
const endDrag = e => {
  pointers.delete(e.pointerId);
  if (reorder) return endReorder(e);
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  d.el.classList.remove('dragging');
  if (!d.moved && e.type === 'pointerup') {
    const now = performance.now();
    if (lastTap.key === d.key && now - lastTap.t < 320) { d.c.set(d.c.def); refresh(d.key); lastTap = {key: null, t: 0}; clearTimeout(tapTimer); return; }
    lastTap = {key: d.key, t: now};
    if (d.type === 'knob' && S.size === 'phone' && S.route.view === 'plugin' && !S.pinMode && !S.sheet) {
      tapTimer = setTimeout(() => { S.sheet = 'focus:' + d.key; render(); }, 330);
    }
  }
};
let tapTimer;
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);
app.addEventListener('dblclick', e => { const el = e.target.closest('[data-ctl]'); if (el && S.size !== 'phone') { const c = ctl(el.dataset.ctl); c.set(c.def); refresh(el.dataset.ctl); } });
app.addEventListener('wheel', e => {
  const el = e.target.closest('.knob[data-ctl],[data-type="num"]'); if (!el) return;
  e.preventDefault(); const c = ctl(el.dataset.ctl); c.set(clamp(c.get() - Math.sign(e.deltaY) * (e.shiftKey ? 0.005 : 0.02))); refresh(el.dataset.ctl);
}, {passive: false});
app.addEventListener('keydown', e => {
  const el = e.target.closest('[data-ctl]'); if (!el) return;
  const step = {ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1}[e.key]; if (!step) return;
  e.preventDefault(); const c = ctl(el.dataset.ctl); c.set(clamp(c.get() + step * (e.shiftKey ? 0.005 : 0.02))); refresh(el.dataset.ctl);
});

// drag-to-reorder within a section
let reorder = null;
function startReorder(e, h){
  const [a0, b0] = h.dataset.drag.split(':'), ti = tkey(a0), pi = +b0;
  const cardEl = h.closest('.card'), sec = h.closest('.section');
  const siblings = [...sec.querySelectorAll('.card[data-card]')];
  reorder = {ti, pi, cardEl, siblings, x0: e.clientX, y0: e.clientY, vert: S.size === 'phone', id: e.pointerId, snapshot: trk(ti).chain.slice()};
  h.setPointerCapture(e.pointerId); e.preventDefault(); cardEl.classList.add('drag');
}
function moveReorder(e){
  const r = reorder; const dx = (e.clientX - r.x0) / frameScale, dy = (e.clientY - r.y0) / frameScale;
  r.cardEl.style.transform = r.vert ? `translateY(${dy}px)` : `translateX(${dx}px)`;
  r.px = e.clientX; r.py = e.clientY;
}
function endReorder(){
  const r = reorder; reorder = null; r.cardEl.classList.remove('drag'); r.cardEl.style.transform = '';
  if (r.px == null) return;
  const others = r.siblings.filter(s => s !== r.cardEl);
  let before = null;
  for (const s of others) { const b = s.getBoundingClientRect(); if (r.vert ? r.py < b.top + b.height / 2 : r.px < b.left + b.width / 2) { before = s; break; } }
  const chain = trk(r.ti).chain, moved = chain[r.pi];
  const itemOf = el => r.snapshot[+el.dataset.card];   // ≈ MoveProcessorOnTrack{before_processor}
  chain.splice(r.pi, 1);
  let idx;
  if (before) idx = chain.indexOf(itemOf(before));
  else { const lastSib = others[others.length - 1]; idx = lastSib ? chain.indexOf(itemOf(lastSib)) + 1 : r.pi; }
  chain.splice(idx, 0, moved); S.dirty = true; render();
}

// ---------------------------------------------------------------- clicks
app.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'), act = e.target.closest('[data-act]'), sh = e.target.closest('[data-sheet]'), row = e.target.closest('[data-row]'), ak = e.target.closest('[data-addkind]'), pin = e.target.closest('[data-pin]');
  if (pin && S.pinMode) return togglePin(pin.dataset.pin);
  if (act) return doAct(act.dataset.act, e);
  if (go) { const [v, t, p] = go.dataset.go.split(':'); S.route = {view: v, t: t === undefined ? 0 : tkey(t), p: +p || 0}; S.sheet = null; S.confirm = null; S.pinMode = false; S.search = ''; return render(); }
  if (sh) { openSheet(sh.dataset.sheet); return; }
  if (ak) { openSheet('addTrack', ak.dataset.addkind); return; }
  if (row && !e.target.closest('[data-ctl],button')) { S.route = {view:'track', t: tkey(row.dataset.row), p: 0}; render(); }
});
const defName = kind => ({midi: 'MIDI ', audio: 'Audio ', bus: 'Bus '}[kind]) + (S.tracks.filter(t => t.kind === kind).length + 1);
function openSheet(name, kind = 'audio', sendFrom = null){
  if (name === 'addTrack') S.form = {kind, name: defName(kind), ch: 'Mono', inst: 'synth', fx: 'dragon', sendFrom};
  S.bsearch = ''; S.sheet = name; render();
}
function togglePin(id){
  const it = trk(S.route.t).chain[S.route.p];
  const i = it.macros.indexOf(id);
  if (i >= 0) it.macros.splice(i, 1); else if (it.macros.length < 6) it.macros.push(id); else return toast('A card shows at most 6 controls');
  render();
}
function toast(msg){ S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 1800); }
function doAct(a, e){
  const [k, x, y, z, w] = a.split(':');
  switch (k) {
    case 'play': S.playing = !S.playing; break;
    case 'stop': S.playing = false; break;
    case 'mute': trk(x).mute = !trk(x).mute; break;
    case 'solo': trk(x).solo = !trk(x).solo; break;
    case 'bypass': { const p = trk(x).chain[+y]; p.bypass = !p.bypass; break; }
    case 'collapse': { const p = trk(x).chain[+y]; p.collapsed = !p.collapsed; break; }
    case 'prog': { const p = trk(x).chain[+y]; const n = p.tpl.programs.length; p.program = (p.program + +z + n) % n; break; }
    case 'setprog': { trk(x).chain[+y].program = +z; if (S.sheet) S.sheet = null; break; }
    case 'ptog': { const p = trk(x).chain[+y]; p.v[z] = p.v[z] ? 0 : 1; break; }
    case 'step': { const it = trk(x).chain[+y]; const p = it.tpl.params.find(q => q.id === z); const st = 1 / (p.max - p.min); it.v[z] = clamp(quantize(p, it.v[z] + st * +w)); refresh(`p:${x}:${y}:${z}`); return; }
    case 'color': trk(x).color = y; break;
    case 'askdel': S.confirm = 'deltrack'; break;
    case 'cancel': S.confirm = null; break;
    case 'deltrack': { const gone = S.tracks.splice(+x, 1)[0]; S.tracks.forEach(t => { t.sends = t.sends.filter(sd => sd.bus !== gone.id); }); } meters.clear(); S.route = {view:'mixer', t:0, p:0}; S.confirm = null; toast('Track deleted'); return;
    case 'pinmode': S.pinMode = !S.pinMode; break;
    case 'scrim': if (e.target !== e.currentTarget && e.target.closest('.sheet')) return; S.sheet = null; break;
    case 'close': S.sheet = null; break;
    case 'reset': { const c = ctl(a.slice(6)); c.set(c.def); refresh(a.slice(6)); return; }
    case 'fkind': S.form.kind = x; S.form.name = defName(x); break;
    case 'fopt': S.form[x] = y; break;
    case 'create': return createTrack();
    case 'addplug': return addPlugin(tkey(x), y, z);
    case 'mixpanel': S.showMix = !S.showMix; render(); return;
    case 'adv': S.advanced = !S.advanced; if (!S.advanced && (S.route.t === 'pre' || S.route.t === 'm')) S.route = {view:'mixer', t:0, p:0}; render(); return;
    case 'delsend': trk(x).sends.splice(+y, 1); break;
    case 'sendmode': trk(x).sends[+y].post = z === 'post'; break;
    case 'addsend': trk(x).sends.push({bus: +y, level: -12, post: true}); S.sheet = null; break;
    case 'newbus': openSheet('addTrack', 'bus', tkey(x)); return;
    case 'save': S.dirty = false; S.sheet = null; toast(`Saved ${S.project}`); return;
    case 'newproj': scenario('empty'); $('#scen').value = 'empty'; break;
  }
  S.dirty = true; render();
}
function createTrack(){
  const f = S.form; f.name = $('#f-name')?.value || f.name;
  const output = $('#f-out')?.value || 'Out 1-2';
  let t;
  if (f.kind === 'bus') {
    t = mkTrack(f.name, 'bus', f.fx ? [inst(f.fx)] : [], {color: PALETTE[(S.tracks.length + 6) % 8], output, pending: true});
    S.tracks.push(t);
  } else {
    const inp = f.kind === 'audio' ? ($('#f-in')?.value || 'In 1') : `MIDI ${($('#f-port')?.value || 'Port 0').split(' ·')[0].toLowerCase()} · ${$('#f-mch')?.value || 'Omni'}`;
    t = mkTrack(f.name, f.kind, f.kind === 'midi' && f.inst ? [inst(f.inst)] : [], {color: PALETTE[S.tracks.length % 8], input: inp, output, channels: f.kind === 'audio' && f.ch === 'Mono' ? 1 : 2, pending: true,
      gen: f.kind === 'midi' ? {base:-14, vary:6, beat:0.6} : {base:-20, vary:8, beat:0}});
    const fb = S.tracks.findIndex(x => x.kind === 'bus');
    S.tracks.splice(fb < 0 ? S.tracks.length : fb, 0, t);
    if (S.route.view !== 'mixer' && typeof S.route.t === 'number' && fb >= 0 && S.route.t >= fb) S.route.t++;
  }
  const from = f.sendFrom != null ? trk(f.sendFrom) : null;
  S.sheet = null; render();
  setTimeout(() => {                       // ≈ CreateTrack → TRACK_ADDED → connections (+ return | peakmeter) → PROCESSOR_ADDED
    t.pending = false;
    if (from) from.sends.push({bus: t.id, level: -12, post: true});
    else if (S.size === 'phone') S.route = {view:'track', t: S.tracks.indexOf(t), p:0};
    render();
  }, 900);
}
function addPlugin(ti, sec, key){
  S.sheet = null; S.pendingPlugin = {t: ti, sec, k: key}; render();
  setTimeout(() => {                       // ≈ CreateProcessorOnTrack(before meter) → PROCESSOR_ADDED
    const tr = trk(ti); const p = inst(key);
    const order = sectionsFor(tr); let idx = tr.chain.length;
    for (let i = 0; i < tr.chain.length; i++) if (order.indexOf(tr.chain[i].tpl.role) > order.indexOf(sec)) { idx = i; break; }
    tr.chain.splice(idx, 0, p); S.pendingPlugin = null; S.dirty = true; render();
  }, 700);
}
app.addEventListener('input', e => {
  if (e.target.id === 'psearch') { S.search = e.target.value; render(); }
  if (e.target.id === 'bsearch') { S.bsearch = e.target.value; render(); }
  if (e.target.id === 'f-name') S.form.name = e.target.value;
});

// swipe between tracks (phone) and [ ] keys (desktop)
let swipe = null;
function stepTrack(dir){
  const ord = navOrder(), n = ord[ord.indexOf(S.route.t) + dir];
  if (n !== undefined) { S.route = {view:'track', t: n, p: 0}; S.confirm = null; render(); }
}
app.addEventListener('pointerdown', e => {
  if (S.route.view !== 'track' || S.size !== 'phone' || !e.target.closest('.chainwrap') || e.target.closest('[data-ctl],[data-drag]')) return;
  swipe = {x: e.clientX, y: e.clientY, id: e.pointerId};
});
app.addEventListener('pointerup', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = (e.clientX - swipe.x) / frameScale, dy = (e.clientY - swipe.y) / frameScale; swipe = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) stepTrack(dx < 0 ? 1 : -1);
});
document.addEventListener('keydown', e => {
  if (S.route.view !== 'track' || S.sheet || e.target.closest('input,select')) return;
  if (e.key === ']') stepTrack(1); else if (e.key === '[') stepTrack(-1);
});

// ---------------------------------------------------------------- device frames
const DEV = {desktop:[1280, 800], tablet:[820, 1180], phone:[390, 844], phoneL:[844, 390]};
let frameScale = 1;
const frameEl = $("#frame");
function layoutFrame(){
  const d = S.device;
  document.querySelectorAll('#devseg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === d));
  if (d === 'auto') { frameEl.className = 'frame auto'; frameEl.style.width = frameEl.style.height = frameEl.style.transform = ''; $('#stage').style.height = ''; frameScale = 1; }
  else {
    const [w, h] = DEV[d]; const avail = $('#stage').clientWidth; const availH = Math.max(420, innerHeight - $('#stage').getBoundingClientRect().top - 16);
    frameScale = Math.min(1, avail / w, availH / h);
    frameEl.className = 'frame'; frameEl.style.width = w + 'px'; frameEl.style.height = h + 'px'; frameEl.style.transform = `scale(${frameScale})`;
    $('#stage').style.height = h * frameScale + 'px';
  }
  sizeClass();
}
function sizeClass(){
  const w = app.clientWidth;
  const s = w < 600 ? 'phone' : w < 1024 ? 'tablet' : 'desktop';
  if (s !== S.size) { S.size = s; render(); } else registerMeters();
}
new ResizeObserver(() => sizeClass()).observe(app);
addEventListener('resize', () => { if (S.device !== 'auto') layoutFrame(); });
$('#devseg').addEventListener('click', e => { const b = e.target.closest('[data-dev]'); if (!b) return; S.device = b.dataset.dev; layoutFrame(); render(); });
$('#scen').addEventListener('change', e => { scenario(e.target.value); render(); });
$('#disc').addEventListener('click', () => { S.conn = 'lost'; render(); setTimeout(() => { S.conn = 'ok'; render(); }, 3000); });

scenario('live');
{ // deep links for review, e.g. #view=track&t=0&dev=phone&mix=1&adv=1
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('adv') === '1') S.advanced = true;
  if (h.get('mix') === '1') S.showMix = true;
  if (h.get('dev') && DEV[h.get('dev')]) S.device = h.get('dev');
  if (h.get('view')) S.route = {view: h.get('view'), t: tkey(h.get('t') || '0'), p: +(h.get('p') || 0)};
  if (h.get('sheet')) S.sheet = h.get('sheet');
}
S.size = app.clientWidth < 600 ? 'phone' : app.clientWidth < 1024 ? 'tablet' : 'desktop';
render();
layoutFrame();
})();
</script>
